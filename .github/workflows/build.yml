name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to attach the .deb to a release

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is Raspberry Pi OS Bookworm, the oldest supported; 3.13 is Trixie.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and API tests
        run: python -m unittest discover -v -s tests -t .

  lint:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning deploy/install.sh deploy/eventscreen-setup deploy/eventscreen-check packaging/build-deb.sh
          shellcheck -S warning -s sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm

  deb:
    name: Package
    needs: [test, lint]
    runs-on: ubuntu-latest
    env:
      # Optional, lets a release publish to RCRaceHub/apt immediately.
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' eventscreen/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match __version__ $version"
            exit 1
          fi

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Install it
        run: |
          sudo apt-get update
          # avahi-daemon etc. come from Ubuntu here; cog is only Recommended.
          sudo apt-get install -y ./dist/eventscreen_*_all.deb
          test -x /usr/sbin/eventscreen-setup
          # Runs end to end; on a CI runner most checks fail (no Pi), so ignore the exit code.
          sudo eventscreen-check || true
          test -f /usr/lib/systemd/system/eventscreen-wifi.service
          PYTHONPATH=/usr/lib/eventscreen python3 -c "import eventscreen; print(eventscreen.__version__)"
          sudo apt-get purge -y eventscreen

      - uses: actions/upload-artifact@v4
        with:
          name: eventscreen-deb
          path: dist/*.deb

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

      - name: Tell the apt repository about the release
        if: startsWith(github.ref, 'refs/tags/v') && env.APT_DISPATCH_TOKEN != ''
        run: |
          # Optional: without this secret the apt repo picks the release up
          # on its hourly run instead.
          curl -fsS -X POST \
            -H "Authorization: Bearer $APT_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/RCRaceHub/apt/dispatches \
            -d '{"event_type":"release"}'
