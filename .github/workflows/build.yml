name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to attach the .debs to a release

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit, API and script tests (race detector on)
        shell: bash
        run: go test -race -count=1 -cover -coverprofile=coverage.out -v ./... 2>&1 | tee test.log
      - name: Test summary
        if: always()
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
          {
            echo "### Tests"
            echo
            echo "$(grep -c -- '--- PASS' test.log) passed, $(grep -c -- '--- FAIL' test.log) failed, $(grep -c -- '--- SKIP' test.log) skipped. Total coverage $total."
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            grep -E '^ok ' test.log | sed -E 's|^ok +github.com/RCRaceHub/EventScreenDisplay/([^ \t]+).*coverage: ([0-9.]+%).*|\| \1 \| \2 \||'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (gofmt, vet, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  deb:
    name: Package (${{ matrix.arch }})
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arm64: 64-bit Pi OS (Pi Zero 2 W, Pi 3 and later). armhf: 32-bit
        # Pi OS. amd64: tried out on a PC, and installed below as a check.
        arch: [arm64, armhf, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Work out the version
        shell: bash
        run: |
          # A v* tag sets the version (v0.7.1 -> 0.7.1), so releasing is just
          # pushing a tag. Other builds use the version in the code.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.~][0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME isn't a version; use vMAJOR.MINOR.PATCH, e.g. v0.7.1 or v0.8.0-rc1"
              exit 1
            fi
            # v0.8.0-rc1 -> 0.8.0~rc1, which Debian sorts before 0.8.0.
            version=${version//-/\~}
          else
            version=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)
          fi
          echo "Building version $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build .deb
        run: make deb-${{ matrix.arch }} VERSION="$VERSION"

      - name: Check the binary runs
        shell: bash
        run: |
          sudo apt-get update
          if [[ ${{ matrix.arch }} != amd64 ]]; then
            # binfmt runs the ARM binaries through qemu. The package was
            # renamed in Ubuntu 26.04.
            sudo apt-get install -y qemu-user-binfmt || sudo apt-get install -y qemu-user-static
          fi
          out=$(dist/bin/eventscreen-linux-${{ matrix.arch }} version)
          echo "eventscreen version: $out"
          test "$out" = "$VERSION"
          test "$(dpkg-deb -f dist/eventscreen_*_${{ matrix.arch }}.deb Architecture)" = "${{ matrix.arch }}"

      - name: Install it
        if: matrix.arch == 'amd64'
        run: |
          # avahi-daemon etc. come from Ubuntu here; cog is only Recommended.
          sudo apt-get install -y ./dist/eventscreen_*_amd64.deb
          test -x /usr/sbin/eventscreen-setup
          test -f /usr/lib/systemd/system/eventscreen-wifi.service
          # Runs end to end; on a CI runner most checks fail (no Pi), so ignore the exit code.
          sudo eventscreen-check || true
          test "$(eventscreen version)" = "$VERSION"
          sudo apt-get purge -y eventscreen

      - uses: actions/upload-artifact@v4
        with:
          name: eventscreen-deb-${{ matrix.arch }}
          path: dist/*.deb

  image:
    name: SD card image
    needs: [deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eventscreen-deb-arm64
          path: dist
      # Registers qemu for aarch64 with the F flag, so the image's own
      # binaries run in a chroot.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y mtools parted jq xz-utils

      - name: Work out the image name
        shell: bash
        run: |
          source image/base-image.env
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name=${GITHUB_REF_NAME#v}
          else
            name=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)-dev
          fi
          echo "IMAGE=eventscreen-$name-arm64.img" >> "$GITHUB_ENV"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "BASE_SHA256=$BASE_SHA256" >> "$GITHUB_ENV"

      - name: Cache the Raspberry Pi OS image
        uses: actions/cache@v4
        with:
          path: base.img.xz
          key: raspios-${{ env.BASE_SHA256 }}
      - name: Download the Raspberry Pi OS image
        shell: bash
        run: |
          [[ -f base.img.xz ]] || curl -fsSL --retry 3 -o base.img.xz "$BASE_URL"
          echo "$BASE_SHA256  base.img.xz" | sha256sum -c

      - name: Build the image
        run: sudo image/build-image.sh base.img.xz dist/eventscreen_*_arm64.deb "$IMAGE"
      - name: Check the image
        run: sudo image/check-image.sh "$IMAGE"

      - name: Compress and describe it for Raspberry Pi Imager
        shell: bash
        run: |
          # To stdout: xz -k fails copying the root-owned file's owner.
          xz -T0 -6 -c "$IMAGE" > "$IMAGE.xz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$IMAGE.xz"
          image/imager-json.sh "$IMAGE" "$IMAGE.xz" "$url" "$(date -u +%F)" > eventscreen-imager.json
          mkdir -p out && mv "$IMAGE.xz" eventscreen-imager.json out/
          ls -l out
          {
            echo "### SD card image"
            echo
            echo "\`$IMAGE.xz\`: $(du -m "out/$IMAGE.xz" | cut -f1) MB compressed, $(du -m --apparent-size "$IMAGE" | cut -f1) MB written to the card."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: eventscreen-image
          path: out/*
          compression-level: 0  # already xz
          # Kept briefly on branches: about 900 MB each.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 5 }}

  docker:
    name: Docker image
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for every architecture
        run: docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v6 .
      - name: Smoke test
        run: |
          docker buildx build --load -t eventscreen:ci .
          docker run -d --name es -p 8080:8080 eventscreen:ci
          for _ in $(seq 20); do curl -fsS localhost:8080/api/v1/info && break; sleep 0.5; done
          curl -fsS -X PUT localhost:8080/api/v1/playlist -d '{"items":["http://example.com/"]}'
          curl -fsS localhost:8080/api/v1/status | grep -q '"state":"playing"'
          docker logs es
          docker rm -f es
          docker image ls eventscreen:ci

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, docker, image]
    runs-on: ubuntu-latest
    env:
      # Optional, lets a release publish to RCRaceHub/apt immediately.
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eventscreen-deb-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: eventscreen-image
          path: dist

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          files=(dist/*.deb dist/*.img.xz dist/eventscreen-imager.json)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Tell the apt repository about the release
        if: env.APT_DISPATCH_TOKEN != ''
        run: |
          # Optional: without this secret the apt repo picks the release up
          # on its hourly run instead.
          curl -fsS -X POST \
            -H "Authorization: Bearer $APT_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/RCRaceHub/apt/dispatches \
            -d '{"event_type":"release"}'
